<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Week pictures</title>
<meta name="theme-color" content="#EEF1EA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .wgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: .5rem; }
  @media (min-width: 560px) { .wgrid { grid-template-columns: repeat(6, 1fr); } }
  .wcell {
    position: relative; aspect-ratio: 1; border-radius: var(--r-md);
    border: 1px solid var(--line); background: var(--panel);
    display: grid; place-items: center; cursor: pointer;
    overflow: hidden; font-family: var(--serif); font-size: 1rem;
    color: var(--ink-soft); padding: 0;
  }
  .wcell img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .wcell .lab {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
    font-family: var(--sans); font-size: .66rem; padding: .35rem .2rem .2rem;
    text-align: center; color: #fff;
    background: linear-gradient(transparent, rgba(24,38,31,.75));
  }
  .wcell.empty .lab { color: var(--ink-faint); background: none; }
  .wcell.sel { outline: 2px solid var(--gold); outline-offset: 1px; }
  .wcell.now { box-shadow: inset 0 0 0 2px var(--sage); }

  .preview { width: 100%; aspect-ratio: 1; border-radius: var(--r-lg);
    overflow: hidden; background: var(--hero); position: relative; }
  .preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .preview svg { width: 100%; height: 100%; display: block; }
  .preview .cap { position: absolute; left: 0; right: 0; bottom: 0;
    padding: 2.4rem .9rem .8rem; color: #fff; font-family: var(--serif);
    font-size: 1.5rem; background: linear-gradient(transparent, rgba(60,42,30,.45)); }
  .pos { display: flex; gap: .4rem; margin-top: .6rem; }
  .pos button { flex: 1; border: 1px solid var(--line); background: transparent;
    color: var(--ink-soft); border-radius: var(--r-md); padding: .45rem 0;
    font-family: var(--sans); font-size: .82rem; cursor: pointer; }
  .pos button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--panel); }
</style>
</head>
<body>
<main class="wrap" id="main" hidden>
  <h1>Week pictures</h1>
  <p class="faint" style="margin-top:-.3rem">
    A picture for any week you like. It replaces the drawing on the home card and on
    the Week page. Nothing here leaves your own database.
  </p>

  <section class="panel">
    <div class="panel-head"><h2 id="selTitle">Week</h2>
      <span class="faint" id="selNote"></span></div>

    <div class="preview" id="prev"></div>

    <div class="pos" id="pos">
      <button data-p="top">Show the top</button>
      <button data-p="center" aria-pressed="true">Middle</button>
      <button data-p="bottom">Show the bottom</button>
    </div>

    <label class="fl" for="file">Pick a picture for this week</label>
    <input type="file" id="file" accept="image/*">
    <div style="display:flex;gap:.5rem;margin-top:.8rem">
      <button class="btn" id="save" style="flex:1">Save for this week</button>
      <button class="btn ghost" id="clear" style="flex:0 0 auto">Remove</button>
    </div>
    <p class="faint" id="prog" style="margin:.6rem 0 0">
      It is shrunk to fit the card, so a big photo is fine. The card crops it for you,
      use the three buttons to choose which part shows.
    </p>
  </section>

  <section class="panel" style="margin-bottom:1.6rem">
    <div class="panel-head"><h2>Every week</h2><span class="faint" id="have"></span></div>
    <div class="wgrid" id="grid"></div>
  </section>
</main>

<script type="module">
import { requireAuth, drawNav, drawTop, SETUP, db, doc, setDoc, deleteDoc,
         collection, query, onSnapshot, putFile, getProfile, progress,
         toast, esc, myName, isAdmin } from "./app.js";
import { babyArt } from "./illus.js";

await requireAuth();
drawTop(SETUP.herName); drawNav("more.html");
document.getElementById("main").hidden = false;

const p = progress((await getProfile()).dueDate);
const live = Math.min(40, Math.max(4, p.week));
let sel = live, ART = {}, pos = "center", pending = null;

function paintPreview() {
  const a = ART[sel];
  const box = document.getElementById("prev");
  const src = pending || (a && a.url);
  box.innerHTML = src
    ? `<img src="${esc(src)}" style="object-position:center ${esc(pos)}" alt="">
       <div class="cap">Week ${sel}</div>`
    : babyArt(sel, 600) + `<div class="cap">Week ${sel}</div>`;
  document.getElementById("selTitle").textContent = "Week " + sel;
  document.getElementById("selNote").textContent =
    sel === live ? "this week" : (a ? "has a picture" : "using the drawing");
  document.querySelectorAll("#pos button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.p === pos)));
}

function paintGrid() {
  const cells = [];
  for (let w = 4; w <= 40; w++) {
    const a = ART[w];
    cells.push(`<button class="wcell ${a ? "" : "empty"} ${w === sel ? "sel" : ""} ${
      w === live ? "now" : ""}" data-w="${w}">
      ${a ? `<img src="${esc(a.url)}" style="object-position:center ${
        esc(a.pos || "center")}" alt="">` : ""}
      <span class="lab">${w}</span>
    </button>`);
  }
  document.getElementById("grid").innerHTML = cells.join("");
  document.getElementById("have").textContent =
    Object.keys(ART).length + " of 37 weeks have one";
}

document.getElementById("grid").addEventListener("click", e => {
  const b = e.target.closest("[data-w]"); if (!b) return;
  sel = Number(b.dataset.w);
  pending = null;
  document.getElementById("file").value = "";
  pos = (ART[sel] && ART[sel].pos) || "center";
  paintPreview(); paintGrid();
});

document.getElementById("pos").addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  pos = b.dataset.p;
  paintPreview();
  if (ART[sel] && !pending) {
    await setDoc(doc(db, "weekart", String(sel)), { pos }, { merge: true });
  }
});

document.getElementById("file").addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) { pending = null; paintPreview(); return; }
  const fr = new FileReader();
  fr.onload = () => { pending = fr.result; paintPreview(); };
  fr.readAsDataURL(f);
});

document.getElementById("save").onclick = async () => {
  const f = document.getElementById("file").files[0];
  if (!f) { toast("Pick a picture first"); return; }
  const btn = document.getElementById("save");
  btn.disabled = true;
  document.getElementById("prog").textContent = "Shrinking it";
  try {
    const saved = await putFile(f);
    await setDoc(doc(db, "weekart", String(sel)),
      { url: saved.url, week: sel, pos, by: myName() }, { merge: true });
    pending = null;
    document.getElementById("file").value = "";
    document.getElementById("prog").textContent = "";
    toast("Saved for week " + sel);
  } catch (err) {
    document.getElementById("prog").textContent = err.message || "Could not save that.";
  }
  btn.disabled = false;
};

document.getElementById("clear").onclick = async () => {
  if (!ART[sel]) { pending = null; document.getElementById("file").value = ""; paintPreview(); return; }
  if (!isAdmin()) { toast("Only the owner account can remove these"); return; }
  if (!confirm("Remove the picture for week " + sel + "?")) return;
  await deleteDoc(doc(db, "weekart", String(sel)));
  toast("Removed, back to the drawing");
};

onSnapshot(query(collection(db, "weekart")), s => {
  ART = {};
  s.docs.forEach(d => ART[Number(d.id)] = d.data());
  if (!pending) pos = (ART[sel] && ART[sel].pos) || "center";
  paintPreview(); paintGrid();
});

paintPreview(); paintGrid();
</script>
</body>
</html>
