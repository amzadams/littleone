<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weight</title>
<meta name="theme-color" content="#EEF1EA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .chart { width: 100%; height: 190px; display: block; }
  .chart .ln { fill: none; stroke: var(--sage); stroke-width: 2.4; stroke-linejoin: round; }
  .chart .dot { fill: var(--sage); }
  .chart .ax { stroke: var(--line); stroke-width: 1; }
  .chart text { font-size: 9px; fill: var(--ink-faint); font-family: Inter, sans-serif; }
  .units { display: flex; gap: .4rem; margin-bottom: .6rem; }
  .units button { flex: 1; border: 1px solid var(--line); background: transparent;
    color: var(--ink-soft); border-radius: var(--r-md); padding: .45rem 0;
    font-family: var(--sans); font-size: .85rem; cursor: pointer; }
  .units button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--panel); }
  .big-num { font-family: var(--serif); font-size: 2.1rem; line-height: 1; margin: 0; }
  .del { border: none; background: none; color: var(--ink-faint); font-size: 1.1rem; cursor: pointer; }
</style>
</head>
<body>
<main class="wrap" id="main" hidden>
  <h1>Weight</h1>
  <p class="faint" style="margin-top:-.3rem">A record to show the doctor. No targets here, those are theirs to set.</p>

  <section class="panel">
    <h2>Add a reading</h2>
    <div class="units" id="units">
      <button data-u="lb" aria-pressed="true">Pounds</button>
      <button data-u="kg" aria-pressed="false">Kilograms</button>
    </div>
    <div style="display:flex;gap:.5rem">
      <div style="flex:1.3"><label class="fl" for="d" style="margin-top:0">Day</label>
        <input type="date" id="d"></div>
      <div style="flex:1"><label class="fl" for="v" style="margin-top:0">Weight</label>
        <input type="number" id="v" step="0.1" inputmode="decimal"></div>
    </div>
    <button class="btn wide" id="add" style="margin-top:.8rem">Save</button>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>So far</h2><span class="faint" id="count"></span></div>
    <p class="big-num" id="latest">&mdash;</p>
    <p class="muted" id="change" style="margin:.4rem 0 .2rem"></p>
    <svg class="chart" id="chart" viewBox="0 0 320 190"></svg>
  </section>

  <section class="panel" style="margin-bottom:1.6rem">
    <div class="panel-head"><h2>Every reading</h2></div>
    <div class="rows" id="rows"></div>
  </section>
</main>

<script type="module">
import { requireAuth, drawNav, drawTop, SETUP, db, doc, setDoc, deleteDoc,
         collection, query, orderBy, onSnapshot, dayKey, prettyDate, shortDate,
         toast, myName, isAdmin, getProfile } from "./app.js";

await requireAuth();
drawTop(SETUP.herName); drawNav("more.html");
document.getElementById("main").hidden = false;

const todayKey = dayKey();
const prof = await getProfile();
const due = prof.dueDate || SETUP.dueDate;
let unit = localStorage.getItem("littleone.wunit") || "lb";
let ROWS = [];

document.getElementById("d").value = todayKey;
document.getElementById("d").max = todayKey;

function paintUnits() {
  document.querySelectorAll("#units button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.u === unit)));
}
document.getElementById("units").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  unit = b.dataset.u;
  localStorage.setItem("littleone.wunit", unit);
  paintUnits(); paint();
});
paintUnits();

const toKg = v => unit === "kg" ? v : v * 0.45359237;
const show  = kg => unit === "kg" ? kg : kg / 0.45359237;
const fmt   = kg => show(kg).toFixed(1) + " " + unit;

document.getElementById("add").onclick = async () => {
  const v = parseFloat(document.getElementById("v").value);
  const day = document.getElementById("d").value || todayKey;
  if (!v || v <= 0) { toast("Put a number in first"); return; }
  await setDoc(doc(db, "weights", day), { kg: toKg(v), day, by: myName() }, { merge: true });
  document.getElementById("v").value = "";
  toast("Saved");
};

function weekOf(day) {
  return Math.floor((280 - Math.round(
    (new Date(due + "T00:00:00") - new Date(day + "T00:00:00")) / 86400000)) / 7);
}

function paint() {
  const n = ROWS.length;
  document.getElementById("count").textContent = n ? n + (n === 1 ? " reading" : " readings") : "";
  const last = ROWS[n - 1];
  document.getElementById("latest").textContent = last ? fmt(last.kg) : "\u2014";

  const ch = document.getElementById("change");
  if (n >= 2) {
    const diff = last.kg - ROWS[0].kg;
    ch.textContent = (diff >= 0 ? "Up " : "Down ") +
      show(Math.abs(diff)).toFixed(1) + " " + unit + " since " + prettyDate(ROWS[0].day) + ".";
  } else {
    ch.textContent = n === 1 ? "One reading so far. The shape shows up after a few weeks." : "";
  }

  const c = document.getElementById("chart");
  if (n < 2) { c.innerHTML = ""; }
  else {
    const vals = ROWS.map(r => show(r.kg));
    const lo = Math.min(...vals), hi = Math.max(...vals);
    const pad = Math.max(1, (hi - lo) * 0.18);
    const y0 = lo - pad, y1 = hi + pad;
    const X = i => 30 + (i / (n - 1)) * 278;
    const Y = v => 160 - ((v - y0) / (y1 - y0)) * 134;
    let out = `<line class="ax" x1="30" y1="160" x2="310" y2="160"/>
      <line class="ax" x1="30" y1="20" x2="30" y2="160"/>
      <text x="2" y="24">${y1.toFixed(0)}</text><text x="2" y="162">${y0.toFixed(0)}</text>
      <polyline class="ln" points="${vals.map((v, i) => X(i) + "," + Y(v)).join(" ")}"/>`;
    vals.forEach((v, i) => out += `<circle class="dot" cx="${X(i)}" cy="${Y(v)}" r="3"/>`);
    out += `<text x="30" y="178">${shortDate(ROWS[0].day)}</text>
            <text x="252" y="178">${shortDate(ROWS[n - 1].day)}</text>`;
    c.innerHTML = out;
  }

  document.getElementById("rows").innerHTML = n ? [...ROWS].reverse().map(r =>
    `<div class="row">
      <div class="row-main"><div class="t">${fmt(r.kg)}</div>
        <div class="s">${prettyDate(r.day)} &middot; week ${weekOf(r.day)}</div></div>
      ${isAdmin() ? `<button class="del" data-rm="${r.day}" aria-label="Delete">&times;</button>` : ""}
    </div>`).join("") : `<p class="empty">Nothing yet.</p>`;

  document.querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => {
    if (!confirm("Delete this reading?")) return;
    await deleteDoc(doc(db, "weights", b.dataset.rm));
    toast("Deleted");
  });
}

onSnapshot(query(collection(db, "weights"), orderBy("day", "asc")), s => {
  ROWS = s.docs.map(d => d.data());
  paint();
});
</script>
</body>
</html>
