<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little One</title>
<meta name="theme-color" content="#EEF1EA">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="data.js"></script>
<style>
  /* ---- the hero that collapses away on scroll ---- */
  .hero {
    position: relative;
    border-radius: var(--r-lg);
    overflow: hidden;
    background: var(--hero);
    margin-bottom: .9rem;
    box-shadow: var(--lift);
  }
  .hero .art { display: block; width: 100%; aspect-ratio: 1; }
  .hero .art svg { display: block; width: 100%; height: 100%; }
  .hero .art { position: relative; overflow: hidden; }
  .hero .art img { position: absolute; left: 50%; top: 50%; display: block; }
  .hero .cap {
    position: absolute; left: 0; right: 0; bottom: 0;
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: .8rem; padding: 2.6rem 1.1rem 1rem;
    background: linear-gradient(transparent, rgba(60,42,30,.42));
  }
  .hero .day {
    font-family: var(--serif); font-size: 2rem; line-height: 1;
    color: #fff; margin: 0;
  }
  .hero .day small { display: block; font-family: var(--sans);
    font-size: .74rem; opacity: .9; margin-top: .3rem; letter-spacing: .02em; }
  .hero .open {
    background: rgba(255,255,255,.93); color: var(--ink);
    border-radius: 999px; padding: .5rem 1rem; font-size: .88rem;
    text-decoration: none; white-space: nowrap;
  }

  .greet { padding: .2rem 0 .7rem; }
  .greet .hi { font-size: .88rem; color: var(--ink-soft); margin: 0; }
  .greet .nm { font-family: var(--serif); font-size: 2rem; line-height: 1.1; margin: .05rem 0 0; }

  /* ---- the compact bar that takes over once you scroll ---- */
  .minibar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    background: var(--panel); border-bottom: 1px solid var(--line);
    padding: env(safe-area-inset-top, 0px) 0 0;
    transform: translateY(-110%);
    transition: transform .22s ease;
  }
  .minibar.on { transform: translateY(0); }
  .minibar .inner {
    max-width: var(--wrap); margin: 0 auto;
    display: flex; align-items: center; gap: .7rem;
    padding: .5rem 1.1rem;
  }
  .minibar .pip {
    width: 34px; height: 34px; border-radius: 50%;
    overflow: hidden; flex: none; background: var(--hero);
  }
  .minibar .pip svg { width: 100%; height: 100%; display: block; }
  .minibar .t { font-family: var(--serif); font-size: 1.02rem; line-height: 1.1; }
  .minibar .s { font-size: .74rem; color: var(--ink-faint); }
  .minibar .track { margin-left: auto; width: 86px; }
  .minibar .track .bar { height: 5px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .minibar .track .bar i { display: block; height: 100%; background: var(--sage); }

  .wk-strip {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: .7rem; margin-bottom: .3rem;
  }
  .wk-strip .big { font-family: var(--serif); font-size: 1.55rem; }
  .wk-strip .right { font-size: .82rem; color: var(--ink-faint); text-align: right; }
  .prog { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; margin: .55rem 0 .2rem; }
  .prog i { display: block; height: 100%; background: var(--sage); }
</style>
</head>
<body>

<div class="minibar" id="minibar">
  <div class="inner">
    <span class="pip" id="pip"></span>
    <span>
      <span class="t" id="mbWeek"></span><br>
      <span class="s" id="mbDays"></span>
    </span>
    <span class="track"><span class="bar"><i id="mbBar"></i></span></span>
  </div>
</div>

<main class="wrap" id="main" hidden>

  <!-- everything in here folds away as she scrolls -->
  <div id="collapsible">
    <section class="greet">
      <p class="hi" id="hi"></p>
      <p class="nm" id="nm"></p>
    </section>

    <section class="hero">
      <span class="art" id="art"></span>
      <div class="cap">
        <p class="day" id="dayNum">
          <span id="dayBig"></span>
          <small id="daySmall"></small>
        </p>
        <a class="open" href="week.html">Open</a>
      </div>
    </section>

    <section class="panel">
      <div class="wk-strip">
        <span class="big" id="wkBig"></span>
        <span class="right" id="wkRight"></span>
      </div>
      <div class="prog"><i id="progBar"></i></div>
      <p class="muted" id="babyText" style="margin:.8rem 0 .4rem"></p>
      <p class="muted" id="momText" style="margin:0 0 .4rem"></p>
      <p class="muted" id="tipText" style="margin:0"></p>
    </section>
  </div>

  <!-- what she actually comes back for -->
  <section>
    <div class="panel-head" style="padding:0 .2rem">
      <h2>Latest</h2>
      <a href="updates.html">All updates</a>
    </div>
    <div id="feed"></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>Next visit</h2>
      <a href="appointments.html">All visits</a>
    </div>
    <div id="nextAppt" class="muted">Loading</div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>Today</h2>
      <a href="log.html">Open log</a>
    </div>
    <div id="todaySummary" class="muted">Loading</div>
  </section>

  <a class="alert-link" href="flags.html" style="margin-bottom:1.5rem">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round"><path d="M12 8v5"/><circle cx="12" cy="16.5" r=".6" fill="currentColor"/>
    <path d="M10.3 3.9 2.6 17.4A2 2 0 0 0 4.3 20.4h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
    When to call the doctor straight away
  </a>

</main>

<script type="module">
import { requireAuth, drawNav, drawTop, getProfile, progress, prettyDate,
         SETUP, db, doc, getDoc, collection, query, orderBy, limit, onSnapshot,
         dayKey, esc, timeAgo, watchUpdatesForNotices, askNotify, notify } from "./app.js";
import { babyArt } from "./illus.js";

await requireAuth();
drawTop("");
drawNav("index.html");
document.getElementById("main").hidden = false;

const profile = await getProfile();
const p = progress(profile.dueDate);

/* ---- greeting ---- */
const hour = new Date().getHours();
document.getElementById("hi").textContent =
  "Good " + (hour < 12 ? "morning" : hour < 17 ? "afternoon" : "evening") + ",";
document.getElementById("nm").textContent = SETUP.herName;

/* ---- hero: an uploaded picture for this week, else the drawing ---- */
const artBox = document.getElementById("art");
artBox.innerHTML = babyArt(p.week, 600);

getDoc(doc(db, "weekart", String(p.week))).then(sn => {
  if (!sn.exists()) return;
  const a = sn.data();
  const c = a.crop || { zoom: 1, x: 0, y: 0 };
  artBox.innerHTML = `<img src="${esc(a.url)}" alt="The baby at week ${p.week}">`;
  const img = artBox.querySelector("img");
  const place = () => {
    const bw = artBox.clientWidth || 320, bh = artBox.clientHeight || bw;
    const fill = Math.max(bw / (img.naturalWidth || 1), bh / (img.naturalHeight || 1)) * (c.zoom || 1);
    img.style.width = (img.naturalWidth * fill) + "px";
    img.style.height = (img.naturalHeight * fill) + "px";
    img.style.transform = `translate(calc(-50% + ${c.x || 0}%), calc(-50% + ${c.y || 0}%))`;
  };
  if (img.complete) place(); else img.onload = place;
  addEventListener("resize", place, { passive: true });

  document.getElementById("pip").innerHTML =
    `<img src="${esc(a.url)}" alt="" style="width:100%;height:100%;object-fit:cover;
      transform:scale(${c.zoom || 1}) translate(${c.x || 0}%, ${c.y || 0}%)">`;
}).catch(() => {});
document.getElementById("dayBig").textContent = "Day " + p.totalDays;
document.getElementById("daySmall").textContent =
  p.daysLeft + " days to go \u00b7 due " + prettyDate(p.due);

/* ---- this week ---- */
const w = WEEKS[p.week] || WEEKS[40];
document.getElementById("wkBig").textContent =
  "Week " + p.week + (p.day ? " and " + p.day + (p.day === 1 ? " day" : " days") : "");
document.getElementById("wkRight").innerHTML =
  "trimester " + p.trimester + "<br>about the size of " + esc(w[0]);
const pct = Math.round(p.totalDays / 280 * 100);
document.getElementById("progBar").style.width = pct + "%";
document.getElementById("babyText").textContent = w[1];
document.getElementById("momText").textContent = w[2];
document.getElementById("tipText").textContent = w[3];

/* ---- the compact bar ---- */
document.getElementById("pip").innerHTML = babyArt(p.week, 80);
document.getElementById("mbWeek").textContent = "Week " + p.week;
document.getElementById("mbDays").textContent = p.daysLeft + " days to go";
document.getElementById("mbBar").style.width = pct + "%";

const mb = document.getElementById("minibar");
let ticking = false;
addEventListener("scroll", () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    mb.classList.toggle("on", scrollY > 150);
    ticking = false;
  });
}, { passive: true });

/* ---- latest updates, now the first thing under the fold ---- */
onSnapshot(query(collection(db, "updates"), orderBy("createdAt", "desc"), limit(3)), s => {
  const f = document.getElementById("feed");
  if (s.empty) {
    f.innerHTML = `<p class="empty">Nothing posted yet.
      <a href="updates.html">Write the first one</a></p>`;
    return;
  }
  f.innerHTML = s.docs.map(sd => {
    const d = sd.data();
    return `<article class="card ${d.side === "him" ? "from-him" : ""}">
      <div class="meta">${esc(d.author)} &middot; ${timeAgo(d.createdAt)}</div>
      <div class="body ${d.kind === "note" ? "note" : ""}">${esc(d.text)}</div>
    </article>`;
  }).join("");
});

/* ---- next visit, with a nudge when it is close ---- */
onSnapshot(query(collection(db, "appointments"), orderBy("date", "asc")), s => {
  const now = dayKey();
  const next = s.docs.map(d => d.data()).find(a => a.date >= now);
  const n = document.getElementById("nextAppt");
  if (!next) { n.innerHTML = `None booked. <a href="appointments.html">Add one</a>`; return; }
  const days = Math.round((new Date(next.date + "T00:00:00") -
                           new Date(now + "T00:00:00")) / 86400000);
  const soon = days <= 1;
  n.innerHTML = `<span style="font-family:var(--serif);font-size:1.15rem;color:var(--ink)">
      ${esc(next.title || "Checkup")}</span><br>
    ${prettyDate(next.date)}${next.time ? " at " + esc(next.time) : ""}<br>
    <span class="${soon ? "" : "faint"}" ${soon ? 'style="color:var(--rose)"' : ""}>
      ${days === 0 ? "Today" : days === 1 ? "Tomorrow" : "in " + days + " days"}
      ${next.place ? " &middot; " + esc(next.place) : ""}</span>`;

  if (soon) remind(next, days);
});

/* one reminder per visit per device, fired when the site is opened */
async function remind(appt, days) {
  const key = "littleone.reminded." + appt.date + (appt.time || "");
  if (localStorage.getItem(key)) return;
  if (!(await askNotify())) return;
  localStorage.setItem(key, "1");
  notify(days === 0 ? "Visit today" : "Visit tomorrow",
    (appt.title || "Checkup") + (appt.time ? " at " + appt.time : "") +
    (appt.place ? ", " + appt.place : ""));
}

/* ---- today ---- */
const key = dayKey();
const box = document.getElementById("todaySummary");
onSnapshot(query(collection(db, "entries"), orderBy("at", "desc"), limit(200)), async s => {
  const n = s.docs.filter(d => d.data().day === key).length;
  const snap = await getDoc(doc(db, "logs", key));
  const bits = [];
  if (n) bits.push(n + (n === 1 ? " entry" : " entries"));
  if (snap.exists()) {
    const d = snap.data();
    if (d.nausea != null) bits.push("nausea " + d.nausea + " of 5");
    if (d.water) bits.push(d.water + " glasses of water");
    if (d.prenatal) bits.push("prenatal taken");
    if (d.b6) bits.push("B6 taken");
  }
  box.innerHTML = bits.length
    ? esc(bits.join(", "))
    : `Nothing logged yet today. <a href="log.html">Start</a>`;
});

watchUpdatesForNotices();
</script>
</body>
</html>
