<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pictures</title>
<meta name="theme-color" content="#EEF1EA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .kinds { display: flex; gap: .4rem; margin: .2rem 0 .7rem; }
  .kinds button {
    flex: 1; border: 1px solid var(--line); background: transparent;
    color: var(--ink-soft); border-radius: var(--r-md); padding: .5rem 0;
    font-family: var(--sans); font-size: .87rem; cursor: pointer;
  }
  .kinds button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--panel); }
  .lightbox {
    position: fixed; inset: 0; background: rgba(28,43,35,.94);
    display: none; align-items: center; justify-content: center;
    z-index: 80; padding: 1rem;
  }
  .lightbox.on { display: flex; }
  .lightbox img { max-width: 100%; max-height: 80vh; border-radius: var(--r-md); }
  .lightbox .close {
    position: absolute; top: calc(1rem + env(safe-area-inset-top, 0px)); right: 1rem;
    background: none; border: none; color: #fff; font-size: 1.8rem; cursor: pointer;
  }
  .lightbox .rm {
    position: absolute; bottom: calc(1.4rem + env(safe-area-inset-bottom, 0px));
    background: none; border: 1px solid rgba(255,255,255,.4);
    color: #fff; border-radius: var(--r-md); padding: .5rem 1rem;
    font-family: var(--sans); font-size: .85rem; cursor: pointer;
  }
</style>
</head>
<body>

<main class="wrap" id="main" hidden>
  <h1>Pictures</h1>
  <p class="faint" style="margin-top:-.3rem">Scans, the bump, anything worth keeping.</p>

  <section class="panel">
    <div class="kinds" id="kinds">
      <button data-k="scan" aria-pressed="true">Scan</button>
      <button data-k="bump" aria-pressed="false">Bump</button>
      <button data-k="other" aria-pressed="false">Other</button>
    </div>
    <input type="text" id="cap" placeholder="Caption, optional">

    <div style="display:flex;gap:.5rem">
      <div style="flex:1.4">
        <label class="fl" for="dt">Date it was taken</label>
        <input type="date" id="dt">
      </div>
      <div style="flex:1">
        <label class="fl" for="wk">Week</label>
        <input type="number" id="wk" min="1" max="42">
      </div>
    </div>
    <p class="faint" id="wkNote" style="margin:.35rem 0 0"></p>

    <label class="fl" for="file">Pictures, you can pick several</label>
    <input type="file" id="file" accept="image/*" multiple>

    <button class="btn wide" id="up" style="margin-top:.8rem">Save pictures</button>
    <p class="faint" id="prog" style="margin:.6rem 0 0"></p>
  </section>

  <div class="grid" id="grid"></div>
</main>

<div class="lightbox" id="lb">
  <button class="close" id="lbClose" aria-label="Close">&times;</button>
  <img id="lbImg" alt="">
  <button class="rm" id="lbDel" hidden>Delete this picture</button>
</div>

<script type="module">
import { requireAuth, drawNav, drawTop, SETUP, db, collection, addDoc,
         doc, deleteDoc, query, orderBy, onSnapshot, serverTimestamp,
         putFile, removeFile, getProfile, progress, prettyDate, dayKey,
         toast, esc, myName, isAdmin } from "./app.js";

await requireAuth();
drawTop(SETUP.herName);
drawNav("more.html");
document.getElementById("main").hidden = false;

const prof = await getProfile();
const dueDate = prof.dueDate || SETUP.dueDate;
const p = progress(dueDate);
const todayKey = dayKey();
let kind = "scan";

/* work out which week a given date fell in */
function weekFor(day) {
  const due = new Date(dueDate + "T00:00:00");
  const d = new Date(day + "T00:00:00");
  return Math.floor((280 - Math.round((due - d) / 86400000)) / 7);
}

const dtBox = document.getElementById("dt");
const wkBox = document.getElementById("wk");
dtBox.value = todayKey;
dtBox.max = todayKey;
wkBox.value = p.week;

function syncWeek() {
  if (!dtBox.value) return;
  wkBox.value = weekFor(dtBox.value);
  document.getElementById("wkNote").textContent =
    dtBox.value === todayKey ? ""
      : "Taken " + prettyDate(dtBox.value) + ", week " + wkBox.value +
        ". Change the week if that is not right.";
}
dtBox.addEventListener("change", syncWeek);

document.getElementById("kinds").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  kind = b.dataset.k;
  document.querySelectorAll("#kinds button").forEach(x =>
    x.setAttribute("aria-pressed", String(x === b)));
});

document.getElementById("up").onclick = async () => {
  const files = [...document.getElementById("file").files];
  if (!files.length) { toast("Pick a picture first"); return; }

  const btn = document.getElementById("up");
  const prog = document.getElementById("prog");
  btn.disabled = true;

  const day = dtBox.value || todayKey;
  const week = Number(wkBox.value) || weekFor(day);
  const caption = document.getElementById("cap").value.trim();
  let ok = 0, failed = [];

  for (let i = 0; i < files.length; i++) {
    prog.textContent = files.length > 1
      ? "Saving " + (i + 1) + " of " + files.length
      : "Shrinking the picture";
    try {
      const saved = await putFile(files[i]);
      await addDoc(collection(db, "photos"), {
        url: saved.url, path: saved.path, kind,
        caption: caption + (files.length > 1 && caption ? " " + (i + 1) : ""),
        day, week, by: myName(), createdAt: serverTimestamp()
      });
      ok++;
    } catch (err) {
      failed.push(files[i].name + ": " + (err.message || "failed"));
    }
  }

  document.getElementById("file").value = "";
  document.getElementById("cap").value = "";
  prog.textContent = failed.length ? failed.join("  ") : "";
  if (ok) toast(ok === 1 ? "Saved" : ok + " pictures saved");
  btn.disabled = false;
};

let current = null;
const lb = document.getElementById("lb");
document.getElementById("lbClose").onclick = () => lb.classList.remove("on");
document.getElementById("lbDel").hidden = !isAdmin();
document.getElementById("lbDel").onclick = async () => {
  if (!current || !confirm("Delete this picture?")) return;
  await removeFile(current.path);
  await deleteDoc(doc(db, "photos", current.id));
  lb.classList.remove("on");
  toast("Deleted");
};

const q = query(collection(db, "photos"), orderBy("createdAt", "desc"));
onSnapshot(q, snap => {
  const g = document.getElementById("grid");
  if (snap.empty) {
    g.innerHTML = `<p class="empty" style="grid-column:1/-1">No pictures yet.
      The first scan is a good place to start.</p>`;
    return;
  }
  g.innerHTML = snap.docs.map(d => {
    const x = d.data();
    const cap = x.caption || (x.kind === "scan" ? "Scan" : x.kind === "bump" ? "Bump" : "");
    return `<figure class="shot" data-id="${d.id}" style="margin:0">
      <img src="${esc(x.url)}" alt="${esc(cap)}" loading="lazy">
      <figcaption class="cap">${esc(cap)}${x.week ? " &middot; week " + x.week : ""}${
        x.day ? "<br>" + esc(prettyDate(x.day)) : ""}</figcaption>
    </figure>`;
  }).join("");

  g.querySelectorAll(".shot").forEach(fig => {
    fig.onclick = () => {
      const d = snap.docs.find(x => x.id === fig.dataset.id);
      current = { id: d.id, path: d.data().path };
      document.getElementById("lbImg").src = d.data().url;
      lb.classList.add("on");
    };
  });
});
</script>
</body>
</html>
